# This repo is a plugin fork, not a deployable app: Auto DevOps (buildpack
# build, docker-based scanners) does not apply and its docker-in-docker jobs
# fail on these runners. Run the offline verification suite instead.

stages:
  - verify

default:
  image: node:22-slim
  interruptible: true

verify:
  stage: verify
  timeout: 10m
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ripgrep
  script:
    - node --version
    - rg --version
    - node --check lib/index.js
    - node --check tools/asar-pack.mjs
    - node --check tools/install.mjs
    - node --check tools/uninstall.mjs
    - node --check tools/validate.mjs
    - node --check test/run.mjs
    - bash test/sandbox.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
